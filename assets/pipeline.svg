<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img"
     aria-label="End to end pipeline: INGEST using Python &amp;#183; BigQuery then STORE using PostgreSQL then REASON using Ollama, local then SERVE using FastAPI then INTERFACE using React / Next.js. Step 03 runs locally so no data leaves the machine." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Pipeline</title>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="268" rx="14"/></clipPath>
    <pattern id="gf" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111926" stroke-width="1"/>
    </pattern>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.1"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#34d399" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="268" rx="14" fill="#0a0e14"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="268" fill="url(#gf)"/>
    
    <ellipse cx="500" cy="-20" rx="460" ry="170" fill="url(#glow)"/>
    <rect x="0" y="266" width="1000" height="2" fill="url(#hair)"/>
  </g>
  <rect x="40" y="28" width="6" height="6" fill="#22d3ee"/>
  <text x="58" y="34" font-size="11.5" fill="#55606f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2.2">SHEET 05 / PIPELINE</text>
  <text x="948" y="34" font-size="11.5" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" opacity="0.72">$ trace --end-to-end</text>
  <rect x="954" y="24" width="2" height="12" fill="#22d3ee"/>
  <path d="M40 50H960" stroke="#19212e" stroke-width="1"/>
  <text x="40" y="74" font-size="10.9" fill="#55606f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">HOW A PROJECT ACTUALLY GETS BUILT, LEFT TO RIGHT</text>
  <rect x="40" y="100" width="156" height="78" rx="10" fill="#0b1017" stroke="#1d2634"/>
  <text x="53" y="121" font-size="9.8" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.4">01</text>
  <text x="53" y="144" font-size="14.4" fill="#e8eef5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600">INGEST</text>
  <text x="53" y="164" font-size="10.3" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Python &#183; BigQuery</text>
  <path d="M202 139H219" stroke="#2b3a52" stroke-width="1"/>
  <path d="M219 135.5l6 3.5l-6 3.5z" fill="#3d4f6b"/>
  <rect x="231" y="100" width="156" height="78" rx="10" fill="#0b1017" stroke="#1d2634"/>
  <text x="244" y="121" font-size="9.8" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.4">02</text>
  <text x="244" y="144" font-size="14.4" fill="#e8eef5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600">STORE</text>
  <text x="244" y="164" font-size="10.3" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PostgreSQL</text>
  <path d="M393 139H410" stroke="#2b3a52" stroke-width="1"/>
  <path d="M410 135.5l6 3.5l-6 3.5z" fill="#3d4f6b"/>
  <rect x="422" y="100" width="156" height="78" rx="10" fill="#0b1017" stroke="#a78bfa"/>
  <text x="435" y="121" font-size="9.8" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.4">03</text>
  <text x="435" y="144" font-size="14.4" fill="#e8eef5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600">REASON</text>
  <text x="435" y="164" font-size="10.3" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Ollama, local</text>
  <path d="M584 139H601" stroke="#2b3a52" stroke-width="1"/>
  <path d="M601 135.5l6 3.5l-6 3.5z" fill="#3d4f6b"/>
  <rect x="613" y="100" width="156" height="78" rx="10" fill="#0b1017" stroke="#1d2634"/>
  <text x="626" y="121" font-size="9.8" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.4">04</text>
  <text x="626" y="144" font-size="14.4" fill="#e8eef5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600">SERVE</text>
  <text x="626" y="164" font-size="10.3" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FastAPI</text>
  <path d="M775 139H792" stroke="#2b3a52" stroke-width="1"/>
  <path d="M792 135.5l6 3.5l-6 3.5z" fill="#3d4f6b"/>
  <rect x="804" y="100" width="156" height="78" rx="10" fill="#0b1017" stroke="#1d2634"/>
  <text x="817" y="121" font-size="9.8" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.4">05</text>
  <text x="817" y="144" font-size="14.4" fill="#e8eef5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="600">INTERFACE</text>
  <text x="817" y="164" font-size="10.3" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">React / Next.js</text>
  <path d="M40 210H960" stroke="#19212e" stroke-width="1"/>
  <circle cx="45" cy="232" r="3.5" fill="#34d399"/>
  <text x="58" y="236" font-size="11.5" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.3">STEP 03 RUNS ON THE LOCAL MACHINE  &#183;  NO KEYS, NO DATA LEAVING THE BOX</text>
</svg>
