<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" width="1000" height="352" role="img"
     aria-label="Stack, weighted by use. Languages: Python 92, TypeScript 84, SQL 70, JavaScript 48, MATLAB 22. Runtime and data: Ollama and local LLMs 90, FastAPI 78, React and Next.js 72, PostgreSQL 58, BigQuery 44."
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Stack</title>

  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="352" rx="14"/>
    </clipPath>

    <pattern id="grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111926" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="26%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="62%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="90%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="352" rx="14" fill="#0a0e14"/>

  <g clip-path="url(#card)">
    <rect width="1000" height="352" fill="url(#grid-fine)"/>
    <ellipse cx="500" cy="356" rx="520" ry="150" fill="url(#glow)"/>
    <rect x="0" y="350" width="1000" height="2" fill="url(#hairline)"/>
  </g>

  <rect x="40" y="28" width="6" height="6" fill="#22d3ee"/>
  <text x="58" y="34" font-size="10" letter-spacing="2.2" fill="#55606f"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SYSTEMS.MAP</text>
  <text x="948" y="34" font-size="10" text-anchor="end" fill="#22d3ee" opacity="0.72"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ stack --resolve --weighted</text>
  <rect x="954" y="24" width="2" height="12" fill="#22d3ee"/>

  <path d="M40 50h920" stroke="#19212e" stroke-width="1"/>
  <path d="M500 66v228" stroke="#161d29" stroke-width="1"/>

  <text x="40" y="82" font-size="10" letter-spacing="1.8" fill="#5a6472"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LANGUAGES</text>
  <text x="530" y="82" font-size="10" letter-spacing="1.8" fill="#5a6472"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RUNTIME / DATA</text>

  <g font-size="12.5" fill="#c9d1d9">
    <circle cx="45" cy="106" r="3.5" fill="#3572A5"/>
    <text x="58" y="110">Python</text>
    <text x="470" y="110" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">92</text>
    <rect x="58" y="124" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="58" y="124" width="379" height="4" rx="2" fill="#3572A5"/>

    <circle cx="45" cy="144" r="3.5" fill="#3178c6"/>
    <text x="58" y="148">TypeScript</text>
    <text x="470" y="148" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">84</text>
    <rect x="58" y="162" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="58" y="162" width="346" height="4" rx="2" fill="#3178c6"/>

    <circle cx="45" cy="182" r="3.5" fill="#e38c00"/>
    <text x="58" y="186">SQL</text>
    <text x="470" y="186" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">70</text>
    <rect x="58" y="200" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="58" y="200" width="288" height="4" rx="2" fill="#e38c00"/>

    <circle cx="45" cy="220" r="3.5" fill="#f1e05a"/>
    <text x="58" y="224">JavaScript</text>
    <text x="470" y="224" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">48</text>
    <rect x="58" y="238" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="58" y="238" width="198" height="4" rx="2" fill="#f1e05a"/>

    <circle cx="45" cy="258" r="3.5" fill="#e16737"/>
    <text x="58" y="262">MATLAB</text>
    <text x="470" y="262" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">22</text>
    <rect x="58" y="276" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="58" y="276" width="91" height="4" rx="2" fill="#e16737"/>
  </g>

  <g font-size="12.5" fill="#c9d1d9">
    <circle cx="535" cy="106" r="3.5" fill="#a78bfa"/>
    <text x="548" y="110">Ollama / local LLMs</text>
    <text x="960" y="110" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">90</text>
    <rect x="548" y="124" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="548" y="124" width="371" height="4" rx="2" fill="#a78bfa"/>

    <circle cx="535" cy="144" r="3.5" fill="#05998b"/>
    <text x="548" y="148">FastAPI</text>
    <text x="960" y="148" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">78</text>
    <rect x="548" y="162" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="548" y="162" width="321" height="4" rx="2" fill="#05998b"/>

    <circle cx="535" cy="182" r="3.5" fill="#61dafb"/>
    <text x="548" y="186">React / Next.js</text>
    <text x="960" y="186" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">72</text>
    <rect x="548" y="200" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="548" y="200" width="297" height="4" rx="2" fill="#61dafb"/>

    <circle cx="535" cy="220" r="3.5" fill="#7aa6d6"/>
    <text x="548" y="224">PostgreSQL</text>
    <text x="960" y="224" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">58</text>
    <rect x="548" y="238" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="548" y="238" width="239" height="4" rx="2" fill="#7aa6d6"/>

    <circle cx="535" cy="258" r="3.5" fill="#4285f4"/>
    <text x="548" y="262">BigQuery</text>
    <text x="960" y="262" font-size="10" text-anchor="end" fill="#6e7681"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">44</text>
    <rect x="548" y="276" width="412" height="4" rx="2" fill="#171e2a"/>
    <rect x="548" y="276" width="181" height="4" rx="2" fill="#4285f4"/>
  </g>

  <path d="M40 302h920" stroke="#19212e" stroke-width="1"/>
  <text x="40" y="326" font-size="10" letter-spacing="1.4" fill="#55606f"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ALSO  &#183;  CHROME EXTENSIONS  &#183;  CANVAS 2D  &#183;  PDF REPORT PIPELINES  &#183;  CISCO PACKET TRACER</text>
</svg>
