<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 296" width="1000" height="296" role="img"
     aria-label="Upstream work on AOBench, a role aware benchmark for AI agents that operate HPC systems. Pull requests: number 43, add --json to report json and compare runs; number 47, add aobench list coverage; number 50, pay down mypy --strict debt in cli/" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Upstream</title>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="296" rx="14"/></clipPath>
    <pattern id="gf" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111926" stroke-width="1"/>
    </pattern>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34d399" stop-opacity="0.1"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#34d399" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="296" rx="14" fill="#0a0e14"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="296" fill="url(#gf)"/>
    
    <ellipse cx="880" cy="300" rx="380" ry="160" fill="url(#glow)"/>
    <rect x="0" y="294" width="1000" height="2" fill="url(#hair)"/>
  </g>
  <rect x="40" y="28" width="6" height="6" fill="#22d3ee"/>
  <text x="58" y="34" font-size="11.5" fill="#55606f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2.2">SHEET 07 / UPSTREAM</text>
  <text x="948" y="34" font-size="11.5" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" opacity="0.72">$ git log --author=Barshana24</text>
  <rect x="954" y="24" width="2" height="12" fill="#22d3ee"/>
  <path d="M40 50H960" stroke="#19212e" stroke-width="1"/>
  <text x="40" y="84" font-size="15.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">AOBench is a role-aware, permission-enforced benchmark for AI</text>
  <text x="40" y="106" font-size="15.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">agents that operate HPC systems: SLURM, telemetry, RBAC. I work</text>
  <text x="40" y="128" font-size="15.5" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">on its command line interface.</text>
  <text x="40" y="168" font-size="10.9" fill="#55606f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.8">PULL REQUESTS AUTHORED</text>
  <circle cx="46" cy="196" r="3.5" fill="#34d399"/>
  <text x="62" y="200" font-size="12.6" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#43</text>
  <text x="100" y="200" font-size="14.4" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">add --json to report json and compare runs</text>
  <circle cx="46" cy="226" r="3.5" fill="#34d399"/>
  <text x="62" y="230" font-size="12.6" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#47</text>
  <text x="100" y="230" font-size="14.4" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">add aobench list coverage</text>
  <circle cx="46" cy="256" r="3.5" fill="#fbbf24"/>
  <text x="62" y="260" font-size="12.6" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#50</text>
  <text x="100" y="260" font-size="14.4" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">pay down mypy --strict debt in cli/</text>
  <text x="960" y="168" font-size="10.9" fill="#55606f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="1.4">88 TASKS / 29 ENVIRONMENTS</text>
</svg>
