<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 98" width="1000" height="98" role="img"
     aria-label="Work manifest. Six selected projects of fourteen public repositories." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Work manifest</title>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="98" rx="14"/></clipPath>
    <pattern id="gf" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111926" stroke-width="1"/>
    </pattern>
    
    
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#34d399" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="98" rx="14" fill="#0a0e14"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="98" fill="url(#gf)"/>
    
    
    <rect x="0" y="96" width="1000" height="2" fill="url(#hair)"/>
  </g>
  <rect x="40" y="28" width="6" height="6" fill="#22d3ee"/>
  <text x="58" y="34" font-size="11.5" fill="#55606f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2.2">SHEET 06 / WORK MANIFEST</text>
  <text x="948" y="34" font-size="11.5" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" opacity="0.72">$ ls ./projects --selected</text>
  <rect x="954" y="24" width="2" height="12" fill="#22d3ee"/>
  <path d="M40 50H960" stroke="#19212e" stroke-width="1"/>
  <text x="40" y="76" font-size="10.9" fill="#55606f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">SIX OF FOURTEEN PUBLIC REPOSITORIES  &#183;  ANY CARD OPENS ITS REPO</text>
</svg>
