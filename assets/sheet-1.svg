<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 888" width="1000" height="888" role="img"
     aria-label="Barshana Chatterjee, at Barshana24. I build things that put AI to work on real data, usually on a local model. Kolkata, India. Open to collaboration. Systems map, weighted by use. Languages: Python 92, TypeScript 84, SQL 70, JavaScript 48, MATLAB 22. Runtime and data: Ollama / local LLMs 90, FastAPI 78, React / Next.js 72, PostgreSQL 58, BigQuery 44. Pipeline, how a project gets built left to right: INGEST using Python · BigQuery, then STORE using PostgreSQL, then REASON using Ollama, local, then SERVE using FastAPI, then INTERFACE using React / Next.js. Step 03 runs on the local machine, so no keys and no data leave the box." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
