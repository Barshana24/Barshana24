<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img"
     aria-label="Barshana Chatterjee. I build things that put AI to work on real data, usually on a local model." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Barshana Chatterjee</title>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="250" rx="14"/></clipPath>
    <pattern id="gf" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111926" stroke-width="1"/>
    </pattern>
    <pattern id="gm" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#18212f" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#34d399" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="250" rx="14" fill="#0a0e14"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="250" fill="url(#gf)"/>
    <rect width="1000" height="250" fill="url(#gm)"/>
    <ellipse cx="880" cy="30" rx="360" ry="200" fill="url(#glow)"/>
    <rect x="0" y="248" width="1000" height="2" fill="url(#hair)"/>
  </g>
  <g stroke="#22d3ee" stroke-width="1.2" fill="none" opacity="0.34" stroke-linecap="square"><path d="M18 34V18h16"/><path d="M966 18h16v16"/><path d="M982 216v16h-16"/><path d="M34 232H18v-16"/></g>
