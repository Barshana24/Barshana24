<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img"
     aria-label="Barshana Chatterjee. I build things that put AI to work on real data, usually on a local model."
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Barshana Chatterjee</title>

  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="240" rx="14"/>
    </clipPath>

    <pattern id="grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#111926" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#18212f" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="22%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="58%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="88%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="240" rx="14" fill="#0a0e14"/>

  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#grid-fine)"/>
    <rect width="1000" height="240" fill="url(#grid-major)"/>

    <ellipse cx="880" cy="30" rx="360" ry="200" fill="url(#glow-cyan)"/>
    <ellipse cx="90" cy="235" rx="320" ry="170" fill="url(#glow-violet)"/>

    <rect x="0" y="-80" width="1000" height="80" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 320" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="238" width="1000" height="2" fill="url(#hairline)"/>
  </g>

  <g stroke="#22d3ee" stroke-width="1.2" fill="none" opacity="0.34" stroke-linecap="square">
    <path d="M18 34V18h16"/>
    <path d="M966 18h16v16"/>
    <path d="M982 206v16h-16"/>
    <path d="M34 222H18v-16"/>
  </g>

  <rect x="40" y="40" width="6" height="6" fill="#22d3ee"/>
  <text x="58" y="46" font-size="10" letter-spacing="2.2" fill="#55606f"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SHEET 01 / IDENTITY</text>
  <text x="960" y="46" font-size="11" text-anchor="end" fill="#6e7681"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@Barshana24</text>

  <text x="40" y="105" font-size="40" font-weight="700" letter-spacing="0.4" fill="#e8eef5">BARSHANA CHATTERJEE</text>

  <g stroke="#243044" stroke-width="1">
    <path d="M40 126h300"/>
    <path d="M40 121v10"/>
    <path d="M340 121v10"/>
  </g>

  <text x="40" y="160" font-size="15" fill="#8b949e" textLength="504" lengthAdjust="spacing">I build things that put AI to work on real data, usually on a local model.</text>
  <rect x="552" y="148" width="2" height="15" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5"
             calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <circle cx="44" cy="196" r="3.5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="200" font-size="10" letter-spacing="1.5" fill="#6e7681"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">KOLKATA, IN  &#183;  LOCAL-FIRST AI  &#183;  OPEN TO COLLABORATION</text>

  <g opacity="0.9">
    <g stroke="#1b3a44" stroke-width="1">
      <path d="M726 86h208"/>
      <path d="M726 154h208"/>
    </g>

    <g fill="#0a0e14" stroke="#22d3ee" stroke-width="1" opacity="0.55">
      <circle cx="726" cy="86" r="2.5"/><circle cx="742" cy="86" r="2.5"/><circle cx="758" cy="86" r="2.5"/>
      <circle cx="774" cy="86" r="2.5"/><circle cx="790" cy="86" r="2.5"/><circle cx="806" cy="86" r="2.5"/>
      <circle cx="822" cy="86" r="2.5"/><circle cx="838" cy="86" r="2.5"/><circle cx="854" cy="86" r="2.5"/>
      <circle cx="870" cy="86" r="2.5"/><circle cx="886" cy="86" r="2.5"/><circle cx="902" cy="86" r="2.5"/>
      <circle cx="918" cy="86" r="2.5"/><circle cx="934" cy="86" r="2.5"/>
      <circle cx="726" cy="154" r="2.5"/><circle cx="742" cy="154" r="2.5"/><circle cx="758" cy="154" r="2.5"/>
      <circle cx="774" cy="154" r="2.5"/><circle cx="790" cy="154" r="2.5"/><circle cx="806" cy="154" r="2.5"/>
      <circle cx="822" cy="154" r="2.5"/><circle cx="838" cy="154" r="2.5"/><circle cx="854" cy="154" r="2.5"/>
      <circle cx="870" cy="154" r="2.5"/><circle cx="886" cy="154" r="2.5"/><circle cx="902" cy="154" r="2.5"/>
      <circle cx="918" cy="154" r="2.5"/><circle cx="934" cy="154" r="2.5"/>
    </g>

    <path d="M726 120 q13 -21 26 0 q13 21 26 0 q13 -21 26 0 q13 21 26 0 q13 -21 26 0 q13 21 26 0 q13 -21 26 0 q13 21 26 0"
          fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="6 10" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <g stroke="#243044" stroke-width="1">
      <path d="M712 86v68"/>
      <path d="M707 86h10"/>
      <path d="M707 154h10"/>
    </g>
    <text x="700" y="123" font-size="9" text-anchor="end" fill="#55606f"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a</text>
    <text x="726" y="180" font-size="9" letter-spacing="1.6" fill="#4b5563"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SIW WAVEGUIDE / TE10</text>
  </g>
</svg>
